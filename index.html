<script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebApplication", "name": "Fuel Cost", "url": "https://s3eidat.github.io/fuel-cost/", "description": "What will this trip cost in fuel?. Free, private and runs 100% in your browser: no sign-up, no uploads.", "applicationCategory": "UtilitiesApplication", "operatingSystem": "Any (web browser)", "isAccessibleForFree": true, "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}, "image": "https://s3eidat.github.io/fuel-cost/screenshot.png", "author": {"@type": "Person", "name": "s3eidat", "url": "https://github.com/s3eidat"}}</script>

<body data-tool="fuel-cost">
<main class="s3-main">
  <section class="s3-hero">
    <h1>Fuel Cost</h1>
    <p>Work out what a trip costs in fuel, split it between passengers, and see how much a more efficient car would save.</p>
  </section>

  <div class="fc-layout">
    <section class="card stack">
      <h2>Trip</h2>
      <div class="fc-row">
        <label class="field grow">Distance
          <input class="input fc-big" id="dist" inputmode="decimal" autocomplete="off" placeholder="0">
        </label>
        <div class="seg" id="distUnit" role="group" aria-label="Distance unit">
          <button aria-pressed="true" data-v="km">km</button>
          <button aria-pressed="false" data-v="mi">miles</button>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="round"> Round trip (there and back)</label>
      <div class="fc-row">
        <label class="field grow">Fuel price
          <input class="input" id="price" inputmode="decimal" autocomplete="off" placeholder="0.00">
        </label>
        <label class="field">per
          <select class="select" id="priceUnit">
            <option value="L">litre</option>
            <option value="galUS">US gallon</option>
            <option value="galUK">UK gallon</option>
          </select>
        </label>
        <label class="field fc-cur">Currency
          <input class="input" id="cur" maxlength="6" autocomplete="off" dir="auto" placeholder="JD">
        </label>
      </div>
      <label class="field">Split between (people)
        <div class="row nowrap fc-people">
          <button class="btn icon" id="pMinus" aria-label="Fewer people">−</button>
          <input class="input fc-num" id="people" inputmode="numeric" value="1" aria-label="Number of people">
          <button class="btn icon" id="pPlus" aria-label="More people">+</button>
        </div>
      </label>

      <h2 class="fc-h">Car <span id="nameAlbl">A</span></h2>
      <div class="fc-row">
        <label class="field fc-name">Name <input class="input" id="nameA" maxlength="30" dir="auto" placeholder="My car"></label>
        <label class="field grow">Consumption <input class="input" id="consA" inputmode="decimal" autocomplete="off" placeholder="7.5"></label>
        <label class="field">Unit <select class="select fc-cu" id="unitA"></select></label>
      </div>
      <p class="faint fc-conv" id="convA"></p>

      <label class="check"><input type="checkbox" id="compare"> Compare with a second car</label>
      <div id="carB" class="stack" hidden>
        <div class="fc-row">
          <label class="field fc-name">Name <input class="input" id="nameB" maxlength="30" dir="auto" placeholder="Other car"></label>
          <label class="field grow">Consumption <input class="input" id="consB" inputmode="decimal" autocomplete="off" placeholder="5.0"></label>
          <label class="field">Unit <select class="select fc-cu" id="unitB"></select></label>
        </div>
        <label class="field">Its fuel price (blank = same as above)
          <input class="input" id="priceB" inputmode="decimal" autocomplete="off" placeholder="same">
        </label>
        <p class="faint fc-conv" id="convB"></p>
      </div>
    </section>

    <section class="card stack fc-out">
      <div class="fc-res" id="res" aria-live="polite"></div>
      <div class="stats" id="stats"></div>
      <div id="cmp"></div>
      <div class="row end"><button class="btn small" id="copy"><svg class="i"><use href="#i-copy"/></svg>Copy</button></div>
      <p class="faint fc-note">Real consumption depends on speed, traffic, load and air-conditioning. Use your car's real average for the best estimate.</p>
    </section>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
